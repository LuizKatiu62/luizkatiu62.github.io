<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Planner">
<meta name="theme-color" content="#0891b2">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Trip Planner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0f1629;--navy2:#1e3a8a;--navy3:#1d4ed8;
  --teal:#0891b2;--teal2:#0e7490;--teal3:#22d3ee;
  --amber:#f59e0b;--amber2:#fbbf24;
  --green:#059669;--green2:#10b981;--red:#ef4444;
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--light:#94a3b8;
  --border:#e2e8f0;--sep:rgba(15,22,41,.06);
  --shadow:0 4px 16px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 12px 32px rgba(0,0,0,.13),0 4px 8px rgba(0,0,0,.06);
  --r:18px;--r-sm:12px;
  --sft:env(safe-area-inset-top,0px);
  --sfb:env(safe-area-inset-bottom,0px);
}
html,body{min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',sans-serif}

/* ── HERO ── */
.hero{background:linear-gradient(155deg,var(--navy) 0%,var(--navy2) 52%,var(--teal) 100%);padding-top:env(safe-area-inset-top,44px);padding-bottom:56px;position:relative;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
.hero-center{text-align:center;padding:14px 24px 0}
.hero::before{content:'✈';position:absolute;font-size:210px;opacity:.04;top:-10px;right:-35px;transform:rotate(28deg);pointer-events:none;line-height:1}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:32px;background:var(--bg);border-radius:28px 28px 0 0}
.hero-back{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);color:#fff;border-radius:22px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.2px;backdrop-filter:blur(4px);white-space:nowrap}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);border-radius:22px;padding:6px 18px;font-size:10px;font-weight:800;color:rgba(255,255,255,.8);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:18px;backdrop-filter:blur(4px)}
.hero-title{font-size:32px;font-weight:900;color:#fff;letter-spacing:-.8px;line-height:1.05;margin-bottom:8px}
.hero-sub{font-size:13px;color:rgba(255,255,255,.82);line-height:1.65;font-weight:400}

/* ── FORM CARD ── */
.form-wrap{max-width:680px;margin:0 auto;padding:0 16px 32px;position:relative;z-index:10}
.form-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden}
.form-section{padding:20px 20px 0}
.form-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--teal);margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:16px;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(8,145,178,.1)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.days-badge{display:inline-flex;align-items:center;gap:5px;background:#e0f2fe;color:var(--teal2);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;margin-top:4px}

/* ── FOOD CHIPS ── */
.food-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* ── BUDGET ── */
.budget-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.budget-opt{position:relative}
.budget-opt input{position:absolute;opacity:0;pointer-events:none}
.budget-opt label{display:flex;flex-direction:column;align-items:center;padding:12px 8px;border-radius:12px;border:1.5px solid #e2e8f0;cursor:pointer;transition:all .15s;background:#fff;text-align:center}
.budget-opt input:checked + label{background:#e0f2fe;border-color:var(--teal)}
.budget-ico{font-size:22px;margin-bottom:4px}
.budget-lbl{font-size:12px;font-weight:700;color:var(--text)}
.budget-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* ── SUBMIT / CLEAR BTNS ── */
.btn-plan{display:block;width:calc(100% - 40px);margin:20px 20px 8px;padding:17px;background:linear-gradient(135deg,var(--navy2),var(--teal2));color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:all .18s;box-shadow:0 6px 20px rgba(30,58,138,.35)}
.btn-plan:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(30,58,138,.45)}
.btn-plan:active{transform:none}
.btn-clear{display:block;width:calc(100% - 40px);margin:0 20px 20px;padding:13px;background:#fff;color:var(--red);border:2px solid #fecaca;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
.btn-clear:hover{background:#fef2f2;border-color:var(--red)}

/* ── RESULTS ── */
.results-wrap{max-width:680px;margin:0 auto;padding:0 16px 60px}
.trip-summary{background:linear-gradient(135deg,#0c4a6e,#0891b2);border-radius:16px;padding:18px 20px;margin-bottom:20px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.ts-left .ts-dest{font-size:20px;font-weight:900}
.ts-left .ts-dates{font-size:13px;color:rgba(255,255,255,.7);margin-top:3px}
.ts-right{text-align:right}
.ts-days{font-size:32px;font-weight:900;line-height:1}
.ts-days-lbl{font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.5px}

/* ── SECTION ── */
.sec{margin-bottom:22px}
.sec-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;user-select:none}
.sec-icon{font-size:22px}
.sec-title{font-size:16px;font-weight:800;color:var(--text)}
.sec-count{font-size:11px;font-weight:700;color:var(--teal);background:#e0f2fe;border-radius:10px;padding:2px 8px}
.sec-chevron{margin-left:auto;font-size:13px;color:var(--muted);transition:transform .2s}
.sec-body{overflow:hidden;transition:max-height .3s ease}

/* ── DRIVE COST CALCULATOR ── */
.ldc-wrap{padding:4px 0 8px}
.ldc-row{margin-bottom:10px}
.ldc-label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.ldc-input{width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#f8fafc;color:var(--text)}
.ldc-input:focus{border-color:var(--teal);background:#fff}
.ldc-btn{width:100%;padding:12px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:2px}
.ldc-btn:disabled{opacity:.6}
.ldc-result-box{background:#f0f9ff;border-radius:12px;padding:14px;margin-top:12px;border:1.5px solid #bae6fd}
.ldc-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ldc-stat{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ldc-val{display:block;font-size:18px;font-weight:900;color:var(--navy)}
.ldc-lbl{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.ldc-maps-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;border-radius:12px;padding:13px;font-size:14px;font-weight:800;text-decoration:none;font-family:inherit}
.ldc-swap{background:none;border:1.5px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--muted);float:right;margin-top:-2px}

/* ── LINK CARDS ── */
.link-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--border);text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:all .18s;cursor:pointer}
.link-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(8,145,178,.2);border-color:var(--teal3)}
.link-card:active{transform:none;opacity:.8}
.lc-top{display:flex;align-items:center;gap:8px}
.lc-ico{font-size:24px;flex-shrink:0}
.lc-name{font-size:14px;font-weight:800;color:var(--text)}
.lc-tag{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;align-self:flex-start}
.tag-free{background:#dcfce7;color:#166534}
.tag-cheap{background:#fef9c3;color:#854d0e}
.tag-best{background:#dbeafe;color:#1e40af}
.tag-event{background:#f3e8ff;color:#6b21a8}
.lc-desc{font-size:11px;color:var(--muted);line-height:1.4}
.lc-cost{font-size:11px;color:var(--green);font-weight:700;margin-top:2px}
.lc-btn{margin-top:4px;padding:8px 14px;background:var(--teal);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:background .15s}
.lc-btn:hover{background:var(--teal2)}
.link-grid.food{grid-template-columns:1fr}
.link-grid.food .link-card{flex-direction:row;align-items:center}
.link-grid.food .lc-ico{font-size:28px}
.link-grid.food .lc-main{flex:1}
.link-grid.food .lc-btn{white-space:nowrap;flex-shrink:0}

/* ── RESET BTN ── */
.btn-reset{display:block;width:calc(100% - 32px);margin:8px 16px 0;padding:14px;background:#fff;color:var(--teal);border:2px solid var(--teal);border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
.btn-reset:hover{background:#e0f2fe}
/* ── EDIT DEST BTN ── */
.btn-edit-dest{display:flex;align-items:center;gap:6px;margin:0 0 14px auto;padding:8px 16px;background:rgba(255,255,255,.25);color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-edit-dest:hover{background:rgba(255,255,255,.4)}

/* ── EVENT BOX ── */
.event-box{background:#faf5ff;border:1.5px solid #d8b4fe;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.event-box-title{font-size:13px;font-weight:800;color:#6b21a8;margin-bottom:8px}
.event-name-display{font-size:18px;font-weight:900;color:#4c1d95}

/* ── UTILITY ── */
.hidden{display:none!important}
.divider{height:1px;background:var(--border);margin:20px 0}

/* ── TABS ── */
.tab-bar{max-width:680px;margin:0 auto;padding:8px 16px 0;position:relative;z-index:11;display:flex;gap:3px}
.tab-top{flex:1;padding:11px 4px;border:none;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .18s;border-radius:10px 10px 0 0;letter-spacing:.2px;white-space:nowrap}
.tab-top.tab-green:not(.active){background:rgba(5,150,105,.8);color:#fff}
.tab-top.tab-green.active{background:#fff;color:#059669;box-shadow:0 -3px 10px rgba(0,0,0,.07)}
.tab-top.tab-amber:not(.active){background:rgba(180,83,9,.8);color:#fff}
.tab-top.tab-amber.active{background:#fff;color:#b45309;box-shadow:0 -3px 10px rgba(0,0,0,.07)}
.tab-top.active{background:#fff;color:var(--navy2);box-shadow:0 -3px 10px rgba(0,0,0,.07)}
.tab-top:not(.active){background:rgba(15,22,41,.55);color:rgba(255,255,255,.82);box-shadow:none}
.rt-form-wrap{max-width:680px;margin:0 auto;padding:0 16px 32px;position:relative;z-index:10}
.rt-form-card{background:#fff;border-radius:0 20px 20px 20px;box-shadow:var(--shadow-lg);overflow:hidden}
.form-card{border-radius:20px 0 20px 20px!important}

/* ── ROUND TRIP TOGGLE ── */
.rt-options-row{display:flex;gap:12px;align-items:flex-end}
.rt-toggle-label{display:flex;align-items:center;gap:8px;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;cursor:pointer;background:#fff;transition:all .15s;font-size:14px;font-weight:600;color:var(--text);width:100%}
.rt-toggle-label input{width:18px;height:18px;accent-color:var(--teal);flex-shrink:0}
.rt-toggle-label:has(input:checked){border-color:var(--teal);background:#e0f2fe;color:var(--teal2)}

/* ── ROUTE SUMMARY ── */
.route-sum{background:linear-gradient(135deg,#0c4a6e,#0891b2);border-radius:16px;padding:18px 20px;margin-bottom:12px;color:#fff}
.rs-title{font-size:16px;font-weight:900;margin-bottom:14px}
.rs-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rm{background:rgba(255,255,255,.15);border-radius:10px;padding:12px 14px}
.rm-val{font-size:22px;font-weight:900;line-height:1}
.rm-lbl{font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* ── COST BOX ── */
.cost-box{background:linear-gradient(135deg,#064e3b,#059669);border-radius:16px;padding:18px 20px;margin-bottom:16px;color:#fff}
.cost-box-title{font-size:15px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.cost-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.cost-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.cost-row-label{color:rgba(255,255,255,.8)}
.cost-row-val{font-weight:800;font-size:14px}
.cost-sep{height:1px;background:rgba(255,255,255,.2);margin:6px 0}
.cost-hotel-sect{background:rgba(255,255,255,.12);border-radius:12px;padding:12px;margin-top:8px}
.cost-hotel-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.htier-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.htier-btn{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:10px;padding:10px 6px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s;line-height:1.4}
.htier-btn:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6)}
.htier-btn.htier-sel{background:#fff;color:#059669;border-color:#fff}
.cost-totals{border-top:1px solid rgba(255,255,255,.25);padding-top:12px;display:flex;gap:10px}
.cost-total-item{flex:1;background:rgba(255,255,255,.15);border-radius:10px;padding:12px 10px;text-align:center}
.cost-total-item.rt-total{background:rgba(255,255,255,.25)}
.cti-lbl{font-size:10px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.cti-val{font-size:20px;font-weight:900}
.cost-note{font-size:10px;color:rgba(255,255,255,.5);margin-top:10px;text-align:center}

/* ── STOP CARD ── */
.stop-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px;overflow:hidden}
.stop-hdr{background:linear-gradient(90deg,#f0f9ff,#e0f2fe);padding:11px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.stop-badge{font-size:10px;font-weight:700;color:var(--teal2);background:#fff;border:1px solid var(--teal3);border-radius:8px;padding:3px 8px;white-space:nowrap;flex-shrink:0}
.stop-city{font-size:13px;font-weight:700;color:var(--text);flex:1}
.stop-body{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sl-sect{grid-column:span 2;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--teal);padding:4px 0 2px;border-bottom:1px solid var(--border);margin-top:4px}
.sl-sect:first-child{margin-top:0}
.sl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid #e2e8f0;text-decoration:none;transition:all .15s;cursor:pointer}
.sl:hover,.sl:active{border-color:var(--teal);background:#f0f9ff}
.sl:active{opacity:.75}
.sl.sl-hotel{border-color:#d8b4fe;background:#faf5ff}
.sl.sl-hotel:hover,.sl.sl-hotel:active{border-color:#9333ea}
.sl.sl-wide{grid-column:span 2}
.sl-ico{font-size:20px;flex-shrink:0}
.sl-name{font-size:12px;font-weight:800;color:var(--text)}
.sl-sub{font-size:10px;color:var(--muted);margin-top:1px}

/* ── PARKING DIRECT ── */
.park-direct{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pd-card{background:#fff;border-radius:14px;padding:14px 12px;box-shadow:var(--shadow);border:2px solid #e2e8f0;text-decoration:none;display:flex;align-items:flex-start;gap:10px;transition:all .18s;cursor:pointer}
.pd-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 6px 20px rgba(8,145,178,.2)}
.pd-card:active{opacity:.75}
.pd-ico{font-size:24px;flex-shrink:0;margin-top:2px}
.pd-name{font-size:13px;font-weight:800;color:var(--text)}
.pd-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.pd-cost{font-size:11px;color:var(--green);font-weight:700;margin-top:3px}
.pd-tag{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:5px;display:inline-block}
.pd-pre{background:#dbeafe;color:#1e40af}
.pd-free{background:#dcfce7;color:#166534}
.pd-live{background:#fef9c3;color:#854d0e}

/* ── COST EDIT PANEL ── */
.cost-edit-btn{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;float:right;transition:background .15s}
.cost-edit-btn:hover{background:rgba(255,255,255,.28)}
.cost-edit-panel{background:rgba(0,0,0,.2);border-radius:12px;padding:14px;margin-bottom:12px}
.cost-edit-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.7);margin-bottom:10px}
.cost-edit-row{margin-bottom:10px}
.cost-edit-row label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.75);margin-bottom:4px}
.cost-edit-row input{width:100%;padding:9px 12px;border:1.5px solid rgba(255,255,255,.3);border-radius:9px;background:rgba(255,255,255,.15);color:#fff;font-size:16px;font-family:inherit;outline:none}
.cost-edit-row input::placeholder{color:rgba(255,255,255,.4)}
.cost-edit-row input:focus{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.22)}
.cost-apply-btn{width:100%;padding:11px;background:#fff;color:#059669;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s}
.cost-apply-btn:hover{background:#f0fdf4}

/* ── RT SPINNER ── */
@keyframes rtSpin{to{transform:rotate(360deg)}}
.rt-spin{display:inline-block;animation:rtSpin 1s linear infinite}

/* ── REAL EXPENSES ── */
.exp-box{background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
/* Header — full green gradient with hero total */
.exp-header{background:linear-gradient(135deg,#064e3b 0%,#059669 100%);padding:18px 16px 20px;position:relative}
.exp-header-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.exp-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.exp-period{font-size:13px;font-weight:700;color:#fff}
.exp-snap-badge{background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.45);color:#fde68a;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0}

function autofillProvince(cityId, stateId, countryId){
  const city = document.getElementById(cityId).value.trim();
  const stateEl = document.getElementById(stateId);
  if(!city || stateEl.value.trim()) return;
  const entry = CITY_PROV[city.toLowerCase()];
  if(entry){
    stateEl.value = entry[0];
    document.getElementById(countryId).value = entry[1];
  } else {
    geocodeForProvince(city, stateId, countryId);
  }
}

async function geocodeForProvince(city, stateId, countryId){
  try {
    const r = await fetch(
      'https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(city)+
      '&format=json&limit=1&addressdetails=1',
      {headers:{'Accept-Language':'en'}}
    );
    const d = await r.json();
    if(!d||!d.length) return;
    const a = d[0].address || {};
    const stateEl = document.getElementById(stateId);
    const countryEl = document.getElementById(countryId);
    if(stateEl.value.trim()) return; // filled in the meantime
    const fullState = a.state || a.province || '';
    const isoCode = (a['ISO3166-2-lvl4']||'').split('-').pop();
    const abbr = PROV_ABBR[fullState] || STATE_ABBR[fullState] || isoCode || fullState;
    if(abbr) stateEl.value = abbr;
    const ctry = (a.country||'').toLowerCase();
    const cmap = {'canada':'Canada','united states':'USA','brazil':'Brazil','united kingdom':'UK','france':'France','portugal':'Portugal'};
    if(cmap[ctry]) countryEl.value = cmap[ctry];
  } catch(e){}
}

// ── GEO / ROUTING ────────────────────────────────────────────────────────────
async function _nominatimSearch(q){
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=1',{headers:{'Accept-Language':'en'}});
    const d=await r.json();
    return(d&&d.length)?{lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)}:null;
  }catch(e){return null;}
}
async function geocodePlace(query){
  // Strategy 1: full text
  var r=await _nominatimSearch(query);
  if(r) return r;
  // Strategy 2: if there's a postal/zip code, strip leading business-name segment and retry
  var canPost=query.match(/\b([A-Z][0-9][A-Z]\s?[0-9][A-Z][0-9])\b/i);
  var usZip=!canPost&&query.match(/\b(\d{5}(?:-\d{4})?)\b/);
  if(canPost||usZip){
    var stripped=query.replace(/^[^,\d]*,\s*/,''); // drop first segment if it has no leading digit (business name)
    if(stripped&&stripped!==query){
      r=await _nominatimSearch(stripped);
      if(r) return r;
    }
    var postal=(canPost?canPost[1]:usZip[1]).toUpperCase();
    r=await _nominatimSearch(postal+(canPost?' Canada':''));
    if(r) return r;
  }
  return null;
}

async function getOSRMRoute(lng1,lat1,lng2,lat2){
  try{
    const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+lng1+','+lat1+';'+lng2+','+lat2+'?overview=false');
    const d=await r.json();
    return(d.routes&&d.routes.length)?{distance:d.routes[0].distance,duration:d.routes[0].duration}:null;
  }catch(e){return null;}
}

async function reverseCity(lat,lng){
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lng+'&format=json&accept-language=en',{headers:{'Accept-Language':'en'}});
    const d=await r.json(); const a=d.address||{};
    return a.city||a.town||a.village||a.county||'';
  }catch(e){return '';}
}

// ── CALCULATE ROUTE ───────────────────────────────────────────────────────────
async function calculateRoute(){
  const origCity=document.getElementById('rt-origin-city').value.trim();
  const origState=document.getElementById('rt-origin-state').value.trim();
  const origCountry=document.getElementById('rt-origin-country').value;
  const destCity=document.getElementById('rt-dest-city').value.trim();
  const destState=document.getElementById('rt-dest-state').value.trim();
  const destCountry=document.getElementById('rt-dest-country').value;
  const venue=document.getElementById('rt-venue').value.trim();
  const consumption=parseFloat(document.getElementById('rt-consumption').value)||10;
  const fuelPrice=parseFloat(document.getElementById('rt-fuelprice').value)||1.65;
  const travelers=parseInt(document.getElementById('rt-travelers').value)||2;
  const roundTrip=document.getElementById('rt-roundtrip').checked;

  if(!origCity){alert('Please enter your origin city.');return;}
  if(!destCity){alert('Please enter your destination city.');return;}

  _rtView='results';
  document.getElementById('rt-form-section').classList.add('hidden');
  document.getElementById('rt-results-section').classList.remove('hidden');
  document.getElementById('rt-results-content').innerHTML=
    '<div style="text-align:center;padding:48px 20px">'+
    '<div class="rt-spin" style="font-size:40px">⚙️</div>'+
    '<div style="font-size:15px;font-weight:700;color:var(--text);margin-top:14px">Calculating your route…</div>'+
    '<div style="font-size:13px;color:var(--muted);margin-top:6px">Locating origin and destination</div></div>';
  window.scrollTo({top:0,behavior:'smooth'});

  const origQ=[origCity,origState,origCountry!=='Other'?origCountry:''].filter(Boolean).join(', ');
  const destQ=[destCity,destState,destCountry!=='Other'?destCountry:''].filter(Boolean).join(', ');
  const[origGeo,destGeo]=await Promise.all([geocodePlace(origQ),geocodePlace(destQ)]);
  if(!origGeo){showRTError('Could not locate: '+origCity+(origState?', '+origState:''));return;}
  if(!destGeo){showRTError('Could not locate: '+destCity+(destState?', '+destState:''));return;}

  const route=await getOSRMRoute(origGeo.lng,origGeo.lat,destGeo.lng,destGeo.lat);
  if(!route){showRTError('Could not calculate route. Please try again.');return;}

  const distKm=route.distance/1000, durMin=route.duration/60;
  const fuelL=(distKm/100)*consumption, fuelCost=fuelL*fuelPrice;
  const origShort=origCity+(origState?', '+origState:'');
  const destShort=destCity+(destState?', '+destState:'');
  const nearAnchor=venue?venue+', '+destCity:destShort;

  const stopCount=Math.min(3,Math.floor(distKm/250));
  const stops=[];
  for(let i=1;i<=stopCount;i++){
    const frac=i/(stopCount+1);
    stops.push({
      id:'rts-'+i,
      lat:origGeo.lat+(destGeo.lat-origGeo.lat)*frac,
      lng:origGeo.lng+(destGeo.lng-origGeo.lng)*frac,
      kmMark:Math.round(distKm*frac)
    });
  }

  // midpoint for overnight hotel booking links
  const midLat=origGeo.lat+(destGeo.lat-origGeo.lat)*0.5;
  const midLng=origGeo.lng+(destGeo.lng-origGeo.lng)*0.5;

  _rtData={
    origShort,destShort,distKm,durMin,fuelL,fuelCost,consumption,fuelPrice,
    stops,nearAnchor,destCity,destState,destCountry,venue,
    travelers,roundTrip,selectedTier:null,hotelCost:0,
    midLat,midLng,mealRate:18,editOpen:false
  };

  document.getElementById('rt-results-content').innerHTML=buildRTHTML(_rtData);
  updateOverviewTab();
  saveState();
  syncActiveStateToFirebase();

  for(const s of stops){
    await rtSleep(1100);
    const name=await reverseCity(s.lat,s.lng);
    const el=document.getElementById(s.id+'-city');
    if(el&&name) el.textContent='Near '+name;
  }

}

function applyRTEdits(){
  if(!_rtData) return;
  const timeStr=document.getElementById('rt-edit-time').value.trim();
  const newFuel=parseFloat(document.getElementById('rt-edit-fuel').value.replace(',','.'));
  const newMeal=parseFloat(document.getElementById('rt-edit-meal').value.replace(',','.'));
  if(timeStr){
    const parts=timeStr.split(':');
    const mins=parts.length===2
      ?parseInt(parts[0])*60+parseInt(parts[1])
      :parseFloat(parts[0])*60;
    if(!isNaN(mins)&&mins>0) _rtData.durMin=mins;
  }
  if(!isNaN(newFuel)&&newFuel>0){ _rtData.fuelPrice=newFuel; _rtData.fuelCost=_rtData.fuelL*newFuel; }
  if(!isNaN(newMeal)&&newMeal>0){ _rtData.mealRate=newMeal; }
  _rtData.editOpen=false;
  // Rebuild full RT HTML so route summary card also reflects new drive time
  document.getElementById('rt-results-content').innerHTML=buildRTHTML(_rtData);
  saveState();
}

// Reads from gastos-casa's own storage key ('gastos') and maps to trip format.
// Only viagens category is shown in Trip Expenses.
// Sub-category mapping: Food→alimentacao, Hotel→hotel, Gasolina→gasolina, Roupas→roupas, rest→outros
function getExpenses(){
  var result=[];
  try{
    var g=JSON.parse(localStorage.getItem('gastos')||'{}');
    var lancs=g.lancamentos||[];
    lancs.forEach(function(l){
      if(l.cat!=='viagens') return;
      var sv=l.divsub||'';
      var cat;
      if(sv.includes('Food')||sv.includes('🍽')) cat='alimentacao';
      else if(sv.includes('Hotel')||sv.includes('🏨')) cat='hotel';
      else if(sv.includes('Gasolina')||sv.includes('⛽')) cat='gasolina';
      else if(sv.includes('Roupas')||sv.includes('👕')) cat='outros';
      else cat='outros';
      result.push({id:l.id,date:l.data,cat:cat,amount:parseFloat(l.valor)||0,
        desc:l.desc||sv||''});
    });
  }catch(e){}
  return result;
}

function expRangePreset(kind){
  var now=new Date();
  var p=function(n){return String(n).padStart(2,'0');};
  var iso=function(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
  if(kind==='tudo'){ _setExpRange('','', 'tudo'); return; }
  if(kind==='30'){ _setExpRange(iso(new Date(Date.now()-29*864e5)), iso(now), '30'); return; }
  if(kind==='mes'){
    _setExpRange(iso(new Date(now.getFullYear(),now.getMonth(),1)),
                 iso(new Date(now.getFullYear(),now.getMonth()+1,0)), 'mes'); return; }
  if(kind==='anterior'){
    _setExpRange(iso(new Date(now.getFullYear(),now.getMonth()-1,1)),
                 iso(new Date(now.getFullYear(),now.getMonth(),0)), 'anterior'); return; }
}

function buildExpensesHTML(d){
  var _r=getExpRange();
  const ci=_r.from, co=_r.to;
  var isSnap=!!_expSnapshot;
  var active, excluded, nTodas=0, nNoPeriodo=0;
  if(isSnap){
    active=_expSnapshot.slice();
    excluded=[];
    nTodas=active.length; nNoPeriodo=active.length;
  } else {
    let all=getExpenses();
    nTodas=all.length;
    // Sem periodo escolhido a lista mostra tudo. Com periodo, cada ponta
    // e opcional: so "De" preenchido = daquela data em diante.
    const filtered=(ci||co)?all.filter(function(e){
      return (!ci||e.date>=ci)&&(!co||e.date<=co);
    }):all;
    nNoPeriodo=filtered.length;
    var excl=[];
    try{excl=JSON.parse(localStorage.getItem(_EXCL_KEY)||'[]');}catch(e){}
    active=filtered.filter(function(e){return excl.indexOf(e.id)===-1;});
    excluded=filtered.filter(function(e){return excl.indexOf(e.id)!==-1;});
  }

  const totals={gasolina:0,hotel:0,alimentacao:0,outros:0};
  active.forEach(function(e){
    const mapped=['gasolina','hotel','alimentacao'].includes(e.cat)?e.cat:'outros';
    totals[mapped]+=e.amount;
  });
  const grandTotal=Object.values(totals).reduce(function(a,b){return a+b;},0);

  // RT estimates (one-way base; cost box already shows round-trip row separately)
  const mealRate=(d&&d.mealRate)||18;
  const stops=(d&&d.stops)?d.stops.length:0;
  const travelers=(d&&d.travelers)||1;
  const rtRooms=Math.ceil(travelers/2);
  const hotelCost=(d&&d.hotelCost)||0;
  const mult=(d&&d.roundTrip)?2:1;
  const estGas=((d&&d.fuelCost)||0)*mult;
  const estFood_rt=stops*mealRate*travelers*mult;
  const estHotel_rt=hotelCost*rtRooms;

  const estHotel=estHotel_rt;
  const estFood=estFood_rt;
  const estTotal=estGas+estFood+estHotel;

  const CATS={
    gasolina:{ico:'⛽',label:'Gas',est:estGas,bubble:'#fff7ed'},
    hotel:{ico:'🏨',label:'Hotel',est:estHotel,bubble:'#eff6ff'},
    alimentacao:{ico:'🍔',label:'Food',est:estFood,bubble:'#fff1f2'},
    outros:{ico:'🛍️',label:'Diversos',est:0,bubble:'#f5f3ff'}
  };

  let catRows='';
  Object.keys(CATS).forEach(function(cat){
    const info=CATS[cat];
    const real=totals[cat];
    if(real===0&&info.est===0) return;
    const diff=real-info.est;
    var pillCls=diff>0?'over':diff<0?'under':'zero';
    var pillTxt=diff>0?'▲ $'+diff.toFixed(2)+' over':(diff<0?'▼ $'+Math.abs(diff).toFixed(2)+' under':(info.est>0?'✓ On budget':''));
    catRows+=
      '<div class="exp-cat-row">'+
      '<div class="exp-cat-bubble" style="background:'+info.bubble+'">'+info.ico+'</div>'+
      '<div class="exp-cat-info">'+
      '<div class="exp-cat-lbl">'+info.label+'</div>'+
      (info.est>0?'<div class="exp-cat-budget">Budget $'+info.est.toFixed(2)+'</div>':'')+
      '</div>'+
      '<div class="exp-cat-right">'+
      '<div class="exp-cat-real">$'+real.toFixed(2)+'</div>'+
      (pillTxt?'<span class="exp-cat-pill '+pillCls+'">'+pillTxt+'</span>':'')+
      '</div>'+
      '</div>';
  });

  function entryHTML(e, isExcluded){
    const mapped=['gasolina','hotel','alimentacao'].includes(e.cat)?e.cat:'outros';
    const info=CATS[mapped];
    const sty=isExcluded?'opacity:.4;':'';
    const txtSty=isExcluded?'style="text-decoration:line-through"':'';
    const btn=isSnap?'':isExcluded
      ?'<button class="exp-del-btn" onclick="includeExpense(\''+e.id+'\')" title="Restore to trip" style="opacity:1;font-size:14px">↩️</button>'
      :'<button class="exp-del-btn" onclick="excludeExpense(\''+e.id+'\')" title="Remove from trip">🗑</button>';
    return '<div class="exp-entry" style="'+sty+'">'+
      '<div class="exp-entry-badge" style="background:'+info.bubble+'">'+info.ico+'</div>'+
      '<div class="exp-entry-body">'+
      '<div class="exp-entry-top">'+
      '<span class="exp-entry-cat" '+txtSty+'>'+info.label+'</span>'+
      '<span class="exp-entry-date">'+e.date+'</span>'+
      '</div>'+
      (e.desc?'<div class="exp-entry-desc" '+txtSty+'>'+e.desc+'</div>':'')+
      '</div>'+
      '<span class="exp-entry-amt" '+txtSty+'>$'+e.amount.toFixed(2)+'</span>'+
      btn+
      '</div>';
  }

  function byNewest(a,b){var dc=b.date.localeCompare(a.date);return dc!==0?dc:(b.id||0)-(a.id||0);}
  const sortedActive=active.slice().sort(byNewest);
  const sortedExcluded=excluded.slice().sort(byNewest);

  const entryList=sortedActive.length===0
    ?'<div style="text-align:center;padding:20px 0;font-size:13px;color:var(--muted)">'+
      'Nenhum lan\u00e7amento de viagem'+((ci||co)?' neste per\u00edodo':'')+'.</div>'
    :sortedActive.map(function(e){return entryHTML(e,false);}).join('');

  const exclSection=sortedExcluded.length===0?'':
    '<div style="padding:8px 16px 4px;border-top:1px dashed #e2e8f0">'+
    '<div style="font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:6px">'+sortedExcluded.length+' excluded from trip</div>'+
    sortedExcluded.map(function(e){return entryHTML(e,true);}).join('')+
    '</div>';

  // Format date for display: "2026-06-04" → "Jun 04"
  function fmtD(s){
    if(!s) return '';
    var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var p=s.split('-'); return mo[parseInt(p[1],10)-1]+' '+p[2]+', '+p[0];
  }
  const dateLabel=(ci||co)
    ?((ci?fmtD(ci):'in\u00edcio')+' \u2192 '+(co?fmtD(co):'hoje'))
    :'Todos os per\u00edodos';
  const diffTotal=grandTotal-estTotal;
  var heroSubCls=diffTotal>0?'over':diffTotal<0?'under':'ok';
  var heroSubTxt=estTotal>0?(diffTotal>0?'▲ $'+diffTotal.toFixed(2)+' above estimate':
    (diffTotal<0?'▼ $'+Math.abs(diffTotal).toFixed(2)+' below estimate':'✓ Right on budget')):'';

  return (isSnap?'':expRangeCard(_r, active.length, nTodas))+
    buildEstTotalHTML(d)+
    '<div class="exp-box">'+
    // ── Header ──
    '<div class="exp-header">'+
    '<div class="exp-header-top">'+
    '<div><div class="exp-title">Trip Actual Expenses</div>'+
    '<div class="exp-period">'+dateLabel+'</div></div>'+
    (isSnap?'<span class="exp-snap-badge">📸 Saved snapshot</span>':'')+
    '</div>'+
    '<div class="exp-hero">'+
    '<div class="exp-hero-amt">$'+grandTotal.toFixed(2)+'</div>'+
    (heroSubTxt?'<div class="exp-hero-sub '+heroSubCls+'">'+heroSubTxt+'</div>':'')+
    '</div>'+
    '</div>'+
    // ── Log expense button (live mode only) ──
    (!isSnap?'<div style="padding:12px 16px 4px">'+
    '<button onclick="saveState();window.location.href=\'index.html\'" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:linear-gradient(135deg,#064e3b,#059669);color:#fff;border:none;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(5,150,105,.25)">'+
    '<span>📝 Log expense in Gastos Casa</span><span style="font-size:18px">›</span>'+
    '</button></div>':'')+
    // ── Category summary ──
    '<div class="exp-cats">'+catRows+'</div>'+
    // ── Individual entries ──
    (sortedActive.length>0?'<div class="exp-section-lbl">'+sortedActive.length+' transaction'+(sortedActive.length!==1?'s':'')+'</div>':'')+
    '<div class="exp-entries">'+entryList+'</div>'+
    exclSection+
    '</div>';
}

// ── BUILD RT HTML ─────────────────────────────────────────────────────────────
function buildRTHTML(d){
  const hrs=Math.floor(d.durMin/60), mins=Math.round(d.durMin%60);
  const time=hrs>0?(hrs+'h '+String(mins).padStart(2,'0')+'min'):(mins+'min');
  const stopMins=d.stops.length*30;
  const totalMin=d.durMin+stopMins;
  const thrs=Math.floor(totalMin/60), tmins=Math.round(totalMin%60);
  const totalTime=thrs>0?(thrs+'h '+String(tmins).padStart(2,'0')+'min'):(tmins+'min');
  let h='';

  const mapsUrl='https://www.google.com/maps/dir/'+encodeURIComponent(d.origShort)+'/'+encodeURIComponent(d.destShort);

  // Route summary
  h+='<div class="route-sum">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
    '<div class="rs-title" style="margin-bottom:0">🚗 '+d.origShort+' → '+d.destShort+'</div>'+
    '<a href="'+mapsUrl+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0">🗺️ Google Maps</a>'+
    '</div>'+
    '<div class="rs-metrics">'+
    '<div class="rm"><div class="rm-val">'+Math.round(d.distKm)+' km</div><div class="rm-lbl">Total distance</div></div>'+
    '<div class="rm"><div class="rm-val">~'+time+'</div><div class="rm-lbl">Pure drive time</div></div>'+
    '<div class="rm"><div class="rm-val">'+d.fuelL.toFixed(1)+' L</div><div class="rm-lbl">Fuel ('+d.consumption+' L/100km)</div></div>'+
    '<div class="rm"><div class="rm-val">~$'+d.fuelCost.toFixed(2)+'</div><div class="rm-lbl">Custo @ $'+d.fuelPrice.toFixed(2)+'/L</div></div>'+
    (d.stops.length>0
      ?'<div class="rm" style="grid-column:span 2;background:rgba(255,255,255,.2)">'+
        '<div class="rm-val">~'+totalTime+'</div>'+
        '<div class="rm-lbl">⏱ Est. total with '+d.stops.length+' stop'+(d.stops.length>1?'s':'')+' (~30 min each)</div></div>'
      :'')+
    '</div></div>';

  // Return trip block (shown only when round trip)
  if(d.roundTrip){
    const retMapsUrl='https://www.google.com/maps/dir/'+encodeURIComponent(d.destShort)+'/'+encodeURIComponent(d.origShort);
    h+='<div class="route-sum" style="margin-top:10px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
      '<div class="rs-title" style="margin-bottom:0">🔄 '+d.destShort+' → '+d.origShort+'</div>'+
      '<a href="'+retMapsUrl+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0">🗺️ Google Maps</a>'+
      '</div>'+
      '<div class="rs-metrics">'+
      '<div class="rm"><div class="rm-val">'+Math.round(d.distKm)+' km</div><div class="rm-lbl">Total distance</div></div>'+
      '<div class="rm"><div class="rm-val">~'+time+'</div><div class="rm-lbl">Pure drive time</div></div>'+
      '<div class="rm"><div class="rm-val">'+d.fuelL.toFixed(1)+' L</div><div class="rm-lbl">Fuel ('+d.consumption+' L/100km)</div></div>'+
      '<div class="rm"><div class="rm-val">~$'+d.fuelCost.toFixed(2)+'</div><div class="rm-lbl">Custo @ $'+d.fuelPrice.toFixed(2)+'/L</div></div>'+
      (d.stops.length>0
        ?'<div class="rm" style="grid-column:span 2;background:rgba(255,255,255,.2)">'+
          '<div class="rm-val">~'+totalTime+'</div>'+
          '<div class="rm-lbl">⏱ Est. total with '+d.stops.length+' stop'+(d.stops.length>1?'s':'')+' (~30 min each)</div></div>'
        :'')+
      '</div></div>';
  }

  // Cost box
  h+='<div class="cost-box" id="rt-cost-box">'+costBoxContent(d)+'</div>';

  // Stops
  if(d.stops.length){
    h+='<div class="sec">'+
      '<div class="sec-header" onclick="toggleStopsSection(this)">'+
        '<span class="sec-icon">🛑</span>'+
        '<span class="sec-title">Stops Along the Route</span>'+
        '<span class="sec-count">'+d.stops.length+'</span>'+
        '<span class="sec-chevron">▼</span>'+
      '</div>'+
      '<div class="sec-body" style="max-height:0">';
    d.stops.forEach(function(s){
      const lat5=s.lat.toFixed(5), lng5=s.lng.toFixed(5);
      const gmGas='https://www.google.com/maps/search/gas+stations/@'+lat5+','+lng5+',13z';
      const gmMcD='https://www.google.com/maps/search/McDonald%27s/@'+lat5+','+lng5+',14z';
      const gmTH='https://www.google.com/maps/search/Tim+Hortons/@'+lat5+','+lng5+',14z';
      const gmSub='https://www.google.com/maps/search/Subway+restaurant/@'+lat5+','+lng5+',14z';
      const gmRest='https://www.google.com/maps/search/restaurants/@'+lat5+','+lng5+',14z';
      const ffEst=(18*d.travelers);
      const restEst=(25*d.travelers);
      h+=
        '<div class="stop-card">'+
        '<div class="stop-hdr">'+

        '</div>'+
        '<div class="stop-body">'+
        '<div class="sl-sect">⛽ Fuel</div>'+
        '<div class="sl sl-wide" onclick="window.open(\''+gmGas+'\',\'_blank\')"><span class="sl-ico">⛽</span><div><div class="sl-name">Gas Stations</div><div class="sl-sub">Google Maps nearby</div></div></div>'+
        '<div class="sl-sect">🍔 Fast Food &nbsp;<span style="font-size:10px;font-weight:400;color:var(--green)">~$'+ffEst+'/stop</span></div>'+
        '<div class="sl" onclick="window.open(\''+gmMcD+'\',\'_blank\')"><span class="sl-ico">🍟</span><div><div class="sl-name">McDonald\'s</div><div class="sl-sub">~$9–14/person</div></div></div>'+
        '<div class="sl" onclick="window.open(\''+gmTH+'\',\'_blank\')"><span class="sl-ico">☕</span><div><div class="sl-name">Tim Hortons</div><div class="sl-sub">~$7–12/person</div></div></div>'+
        '<div class="sl sl-wide" onclick="window.open(\''+gmSub+'\',\'_blank\')"><span class="sl-ico">🥖</span><div><div class="sl-name">Subway</div><div class="sl-sub">~$10–14/person</div></div></div>'+
        '<div class="sl-sect">🍽️ Restaurants &nbsp;<span style="font-size:10px;font-weight:400;color:var(--amber)">~$'+restEst+'/stop</span></div>'+
        '<div class="sl sl-wide" onclick="window.open(\''+gmRest+'\',\'_blank\')"><span class="sl-ico">🍽️</span><div><div class="sl-name">Restaurants on Google Maps</div><div class="sl-sub">Browse all options nearby</div></div></div>'+
        '</div></div>';
    });
    h+='</div></div>';
  }

  h+='<button onclick="saveTripToHistory(this)" style="display:block;width:100%;margin:0 0 8px;padding:14px;background:linear-gradient(135deg,#064e3b,#059669);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(5,150,105,.3)">💾 &nbsp; Salvar Viagem no Histórico</button>';
  h+='<button onclick="newTrip()" style="display:block;width:100%;margin:0 0 8px;padding:13px;background:linear-gradient(135deg,var(--navy2),var(--navy3));color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(29,78,216,.25)">✈️ &nbsp; Nova Viagem</button>';
  h+='<button class="btn-reset" onclick="resetRT()">← Edit Route</button>';
  return h;
}

function toggleStopsSection(hdr){
  var body=hdr.nextElementSibling;
  var chev=hdr.querySelector('.sec-chevron');
  var open=body.style.maxHeight==='none'||parseInt(body.style.maxHeight)>0;
  if(open){
    body.style.maxHeight='0';
    if(chev) chev.style.transform='';
  } else {
    body.style.maxHeight=body.scrollHeight+'px';
    setTimeout(function(){body.style.maxHeight='none';},300);
    if(chev) chev.style.transform='rotate(180deg)';
  }
}

// ── STATE PERSISTENCE & TRIP HISTORY ─────────────────────────────────────────
const _STATE_KEY='trip_planner_state';
const _HIST_KEY='trip_history';

function _captureFields(){
  return {
    rtOC:document.getElementById('rt-origin-city').value,
    rtOS:document.getElementById('rt-origin-state').value,
    rtON:document.getElementById('rt-origin-country').value,
    rtDC:document.getElementById('rt-dest-city').value,
    rtDS:document.getElementById('rt-dest-state').value,
    rtDN:document.getElementById('rt-dest-country').value,
    rtV: document.getElementById('rt-venue').value,
    rtT: document.getElementById('rt-travelers').value,
    rtR: document.getElementById('rt-roundtrip').checked,
    rtCO:document.getElementById('rt-consumption').value,
    rtFP:document.getElementById('rt-fuelprice').value,
    expRange:getExpRange(),
  };
}

function _applyFields(f){
  if(!f) return;
  function sv(id,v){var el=document.getElementById(id);if(el&&v!=null&&v!=='')el.value=v;}
  sv('rt-origin-city',f.rtOC);sv('rt-origin-state',f.rtOS);sv('rt-origin-country',f.rtON);
  sv('rt-dest-city',f.rtDC);sv('rt-dest-state',f.rtDS);sv('rt-dest-country',f.rtDN);
  sv('rt-venue',f.rtV);sv('rt-travelers',f.rtT);sv('rt-consumption',f.rtCO);sv('rt-fuelprice',f.rtFP);
  var rr=document.getElementById('rt-roundtrip');if(rr&&f.rtR!==undefined)rr.checked=f.rtR;
  if(f.expRange&&(f.expRange.from||f.expRange.to||f.expRange.preset)){
    try{localStorage.setItem(_EXPR_KEY,JSON.stringify(f.expRange));}catch(e){}
  }
}

function saveState(){
  try{
    var state={rtView:_rtView, rtData:_rtData,
      activeTab:_activeTab, fields:_captureFields(), expSnapshot:_expSnapshot||null};
    localStorage.setItem(_STATE_KEY,JSON.stringify(state));
    localStorage.setItem('trip_has_data',JSON.stringify({has:!!state.rtData}));
  }catch(e){}
}

function restoreState(){
  var s;
  try{s=JSON.parse(localStorage.getItem(_STATE_KEY));}catch(e){}
  if(!s) return false;
  try{_applyFields(s.fields);}catch(e){}
  _activeTab=s.activeTab||'rt';
  if(s.rtData){
    _rtData=s.rtData;
    // Always try to show results if we have data — ignore saved rtView
    _rtView='results';
    try{document.getElementById('rt-results-content').innerHTML=buildRTHTML(_rtData);}catch(e){_rtView='form';}
  } else {
    _rtView='form';
  }
  _expSnapshot=s.expSnapshot||null;
  try{updateOverviewTab();}catch(e){}
  return true;
}

function saveTripToHistory(btn, skipPrompt){
  var hasRT=!!_rtData;
  if(!hasRT){alert('Sem dados para salvar. Calcule uma rota primeiro.');return;}
  var f=_captureFields();
  var autoName=(_rtData.origShort||'?')+' → '+(_rtData.destShort||'?');
  if(skipPrompt){
    _doSaveTripToHistory(autoName, btn);
    return;
  }
  // Show modal for user to name the trip
  var now=new Date();
  var pad=function(n){return String(n).padStart(2,'0');};
  var tsDisplay=pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear()+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  document.getElementById('save-trip-ts').textContent='Salvo em: '+tsDisplay;
  var inp=document.getElementById('save-trip-name');
  inp.value=autoName;
  var modal=document.getElementById('save-trip-modal');
  modal.style.display='flex';
  setTimeout(function(){inp.focus();inp.select();},80);
  var confirmBtn=document.getElementById('save-trip-confirm-btn');
  confirmBtn.onclick=function(){
    var name=(inp.value||'').trim()||autoName;
    modal.style.display='none';
    _doSaveTripToHistory(name, btn);
  };
  inp.onkeydown=function(e){if(e.key==='Enter'){confirmBtn.onclick();}if(e.key==='Escape'){modal.style.display='none';}};
}

function _doSaveTripToHistory(name, btn){
  var hasRT=!!_rtData;
  var f=_captureFields();
  var now=new Date();
  // Fotografia dos gastos no momento de salvar, no periodo escolhido na aba
  var snapAll=getExpenses();
  var _rr=getExpRange();
  var snapCi=_rr.from, snapCo=_rr.to;
  var snapFiltered=(snapCi||snapCo)?snapAll.filter(function(e){
    return (!snapCi||e.date>=snapCi)&&(!snapCo||e.date<=snapCo);
  }):snapAll;
  var snapExcl=[];
  try{snapExcl=JSON.parse(localStorage.getItem(_EXCL_KEY)||'[]');}catch(e){}
  var expensesSnapshot=snapFiltered.filter(function(e){return snapExcl.indexOf(e.id)===-1;});
  var hist=[];
  try{hist=JSON.parse(localStorage.getItem(_HIST_KEY)||'[]');}catch(e){}
  hist.unshift({
    id:Date.now().toString(36),
    savedAt:now.toISOString(),
    name:name,
    checkin:snapCi, checkout:snapCo,
    rtData:hasRT?_rtData:null,
    fields:f,
    expensesSnapshot:expensesSnapshot
  });
  if(hist.length>30)hist=hist.slice(0,30);
  localStorage.setItem(_HIST_KEY,JSON.stringify(hist));
  renderHistorySection();
  syncTripsToFirebase();
  var b=btn||(event&&event.target);
  if(b&&b.textContent){var t=b.textContent;b.textContent='✅ Salvo!';setTimeout(function(){b.textContent=t;},1800);}
}

function deleteHistoryEntry(id){
  try{
    var hist=JSON.parse(localStorage.getItem(_HIST_KEY)||'[]');
    localStorage.setItem(_HIST_KEY,JSON.stringify(hist.filter(function(h){return h.id!==id;})));
    renderHistorySection();
    syncTripsToFirebase();
  }catch(e){}
}

function loadHistoryEntry(id){
  var hist=[];
  try{hist=JSON.parse(localStorage.getItem(_HIST_KEY)||'[]');}catch(e){}
  var entry=hist.find(function(h){return h.id===id;});
  if(!entry){alert('Trip not found. It may have been deleted.');return;}
  try{_applyFields(entry.fields);}catch(e){}
  if(entry.rtData){
    _rtData=entry.rtData;
    _rtView='results';
    try{document.getElementById('rt-results-content').innerHTML=buildRTHTML(_rtData);}catch(e){}
  } else {
    _rtData=null; _rtView='form';
    document.getElementById('rt-results-section').classList.add('hidden');
  }
  _expSnapshot=entry.expensesSnapshot||null;
  updateOverviewTab();
  saveState();
  syncActiveStateToFirebase();
  switchTab('rt');
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderHistorySection(){
  var el=document.getElementById('rt-history-list');
  if(!el)return;
  var hist=[];
  try{hist=JSON.parse(localStorage.getItem(_HIST_KEY)||'[]');}catch(e){}
  var wrap=document.getElementById('rt-history-wrap');
  var onRT=document.getElementById('tab-rt')&&document.getElementById('tab-rt').classList.contains('active');
  // Always show the wrap on the RT tab — never hide it based on hist.length
  if(wrap)wrap.style.display=onRT?'block':'none';
  if(!hist.length){
    // Don't overwrite loading/error messages set by initTripSync
    return;
  }
  el.innerHTML=hist.map(function(h){
    var sub='';
    if(h.checkin||h.checkout) sub='<div style="font-size:11px;color:var(--teal);font-weight:600">📅 '+(h.checkin||'in\u00edcio')+' → '+(h.checkout||'hoje')+'</div>';
    var savedLabel='';
    try{
      var d=new Date(h.savedAt);
      var pad=function(n){return String(n).padStart(2,'0');};
      if(!isNaN(d.getTime())){
        savedLabel=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
      } else { savedLabel=h.savedAt; }
    }catch(e){savedLabel=h.savedAt||'';}
    return '<div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;border:1.5px solid #e0f2fe;padding:10px 12px;margin-bottom:8px">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:13px;font-weight:700;color:var(--text)">'+h.name+'</div>'+
      sub+
      '<div style="font-size:11px;color:var(--muted)">🕐 '+savedLabel+'</div>'+
      '</div>'+
      '<button onclick="loadHistoryEntry(\''+h.id+'\')" style="background:var(--teal);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap">↩️ Restaurar</button>'+
      '<button onclick="deleteHistoryEntry(\''+h.id+'\')" style="background:none;border:none;font-size:16px;cursor:pointer;opacity:.4;padding:2px 4px;flex-shrink:0">🗑</button>'+
      '</div>';
  }).join('');
}

</script>

      <button class="cb cb-clr" onclick="calcClear()">C</button>
      <button class="cb cb-fn"  onclick="calcToggleSign()">+/−</button>

      <button class="cb cb-op"  onclick="calcOp('÷')">÷</button>

      <button class="cb cb-op"  onclick="calcOp('+')">+</button>
      <button class="cb cb-num" onclick="calcDigit('0')" style="grid-column:span 2">0</button>
      <button class="cb cb-num" onclick="calcDot()">.</button>
      <button class="cb cb-eq"  onclick="calcEqual()">=</button>
    </div>
    <button id="calc-close" onclick="calcToggle()">✕ Close</button>
  </div>
</div>
<script>
(function(){
  var _cVal='0', _cPrev=null, _cOp=null, _cFresh=false;
  function updDisp(){
    document.getElementById('calc-val').textContent=_cVal;
    document.getElementById('calc-expr').textContent=_cPrev&&_cOp?_cPrev+' '+_cOp:'';
  }
  window.calcToggle=function(){
    var o=document.getElementById('calc-overlay');
    o.classList.toggle('open');
  };
  window.calcDigit=function(d){
    if(_cFresh){_cVal='0';_cFresh=false;}
    _cVal=_cVal==='0'?d:(_cVal.length<12?_cVal+d:_cVal);
    updDisp();
  };
  window.calcDot=function(){
    if(_cFresh){_cVal='0';_cFresh=false;}
    if(!_cVal.includes('.'))_cVal+='.';
    updDisp();
  };
  window.calcOp=function(op){
    var n=parseFloat(_cVal);
    if(_cPrev!==null&&_cOp&&!_cFresh){
      n=_doCalc(parseFloat(_cPrev),_cOp,n);
      _cVal=_fmt(n);
    }
    _cPrev=_cVal; _cOp=op; _cFresh=true;
    updDisp();
  };
  window.calcEqual=function(){
    if(_cPrev===null||!_cOp) return;
    var r=_doCalc(parseFloat(_cPrev),_cOp,parseFloat(_cVal));
    _cVal=_fmt(r); _cPrev=null; _cOp=null; _cFresh=true;
    updDisp();
  };
  window.calcClear=function(){_cVal='0';_cPrev=null;_cOp=null;_cFresh=false;updDisp();};
  window.calcToggleSign=function(){_cVal=_fmt(parseFloat(_cVal)*-1);updDisp();};
  window.calcPercent=function(){_cVal=_fmt(parseFloat(_cVal)/100);updDisp();};
  function _doCalc(a,op,b){
    if(op==='+'){ return a+b; }
    if(op==='−'){ return a-b; }
    if(op==='×'){ return a*b; }
    if(op==='÷'){ return b!==0?a/b:0; }
    return b;
  }
  function _fmt(n){
    if(!isFinite(n)) return '0';
    var s=parseFloat(n.toFixed(10)).toString();
    return s.length>12?parseFloat(n.toPrecision(8)).toString():s;
  }
})();

function updateOverviewTab(){

function buildDashboardHTML(rd, dd){
  if(!rd){
    return '<div class="ov-empty">'+
      '<div class="ov-empty-ico">🗺️</div>'+
      '<div class="ov-empty-title">No Trip Planned Yet</div>'+
      '<div class="ov-empty-sub">Calcule uma Road Trip<br>e o resumo aparece aqui.</div>'+
      '</div>';
  }

  // ── Compute costs first (used in Grand Total at top) ──
  var mult=(rd&&rd.roundTrip)?2:1;
  var gasAmt=(rd?(rd.fuelCost||0)*mult:0);
  var rtStops=(rd?(rd.stops||[]).length:0);
  var rtMealRate=(rd?(rd.mealRate||18):18);
  var stopsFood=(rd?rtStops*rtMealRate*(rd.travelers||1)*mult:0);
  var rtRooms=rd?Math.ceil((rd.travelers||2)/2):0;
  var hotelAmt=(rd?(rd.hotelCost||0)*rtRooms:0);
  var ltHotel=0,ltFood=0;
  if(dd&&dd.nights){
    var ddR=dd.rooms!=null?dd.rooms:Math.ceil((dd.travelers||2)/2);
    var ddRate=dd.hotelRate!=null?dd.hotelRate:(dd.budget==='luxury'?225:dd.budget==='moderate'?155:95);
    ltHotel=dd.nights*ddRate*ddR;
    var bf=(dd.breakfastRate==null?15:dd.breakfastRate),lu=(dd.lunchRate==null?20:dd.lunchRate);
    var di=(dd.dinnerRate==null?35:dd.dinnerRate),sn=(dd.snacksRate==null?10:dd.snacksRate);
    ltFood=dd.nights*(bf+lu+di+sn)*(dd.travelers||2);
  }
  var totalGas=gasAmt;
  var totalHotel=hotelAmt+ltHotel;
  var totalFood=stopsFood+ltFood;
  var grandTotal=totalGas+totalHotel+totalFood;
  var travelers=rd&&rd.travelers?rd.travelers:dd&&dd.travelers?dd.travelers:1;

  var html='';

  // ── Grand Total — TOP ──
  if(grandTotal>0){
    html+='<div class="ov-total-card" style="margin-bottom:14px">'+
      '<div class="ov-total-label">📊 Estimated Grand Total</div>'+
      '<div class="ov-total-grid">'+
        '<div class="ov-total-item"><div class="ov-total-val">$'+grandTotal.toFixed(0)+'</div><div class="ov-total-sub">'+(rd&&rd.roundTrip?'Round Trip':'Total')+'</div></div>'+
        '<div class="ov-total-item ov-total-main"><div class="ov-total-val">$'+(grandTotal/travelers).toFixed(0)+'</div><div class="ov-total-sub">Per Person</div></div>'+
      '</div>'+
    '</div>';
  }

  // ── Route Hero Card ──
  if(rd){
    var distText=rd.distKm>=1?rd.distKm.toFixed(0)+' km':'—';
    var durH=Math.floor(rd.durMin/60), durM=Math.round(rd.durMin%60);
    var durText=durH+'h '+(durM<10?'0':'')+durM+'min';
    var rtLabel=rd.roundTrip?'<span class="ov-badge">🔄 Round Trip</span>':'<span class="ov-badge">➡️ One Way</span>';
    var travLabel='<span class="ov-badge">👥 '+rd.travelers+(rd.travelers===1?' traveler':' travelers')+'</span>';
    html+='<div class="ov-hero">'+
      '<div class="ov-route-line">'+
        '<span class="ov-route-dot"></span>'+
        '<span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+rd.origShort+'</span>'+
        '<span class="ov-route-dash"></span>'+
        '<span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right">'+rd.destShort+'</span>'+
        '<span class="ov-route-dot"></span>'+
      '</div>'+
      '<div class="ov-route-sub">'+distText+' &nbsp;·&nbsp; '+durText+'</div>'+
      '<div class="ov-badges">'+rtLabel+travLabel+'</div>'+
    '</div>';

    // Stats grid
    html+='<div class="ov-stats">'+
      '<div class="ov-stat"><span class="ov-stat-ico">📏</span><div class="ov-stat-body"><div class="ov-stat-val">'+distText+'</div><div class="ov-stat-lbl">Distance</div></div></div>'+
      '<div class="ov-stat"><span class="ov-stat-ico">⏱</span><div class="ov-stat-body"><div class="ov-stat-val">'+durText+'</div><div class="ov-stat-lbl">Drive Time</div></div></div>'+
      '<div class="ov-stat"><span class="ov-stat-ico">⛽</span><div class="ov-stat-body"><div class="ov-stat-val">'+rd.fuelL.toFixed(1)+'L</div><div class="ov-stat-lbl">Fuel</div></div></div>'+
      '<div class="ov-stat"><span class="ov-stat-ico">👥</span><div class="ov-stat-body"><div class="ov-stat-val">'+rd.travelers+'</div><div class="ov-stat-lbl">Travelers</div></div></div>'+
    '</div>';
  } else if(dd){
    html+='<div class="ov-hero">'+
      '<div class="ov-route-line"><span class="ov-route-dot"></span><span>'+dd.locShort+'</span></div>'+
      '<div class="ov-route-sub">Local Trip</div>'+
      '<div class="ov-badges"><span class="ov-badge">🌙 '+(dd.nights||1)+' night'+(dd.nights!==1?'s':'')+'</span>'+
      '<span class="ov-badge">👥 '+(dd.travelers||2)+' travelers</span></div>'+
    '</div>';
  }

  // ── Road Trip Estimated Cost Card ──
  if(rd){
    var rtOW=(rd.fuelCost||0)+stopsFood/mult+hotelAmt;
    var rtRT=rtOW*2;
    var rtPpl=rd.travelers===1?'1 person':rd.travelers+' people';
    var rtRmLabel=rtRooms===1?'1 room':rtRooms+' rooms';
    html+='<div class="ov-card" style="background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);border:none">'+
      '<div class="ov-card-title" style="color:rgba(255,255,255,.55)">🚗 Road Trip — Estimated Cost ('+rtPpl+')</div>'+
      '<div class="cost-rows" style="margin:0 -4px">'+
        '<div class="cost-row" style="color:#e2e8f0"><span class="cost-row-label">⛽ Fuel ('+rd.fuelL.toFixed(1)+' L @ $'+(rd.fuelPrice||0).toFixed(2)+'/L)</span><span class="cost-row-val">$'+(rd.fuelCost||0).toFixed(2)+'</span></div>'+
        (rtStops>0?'<div class="cost-row" style="color:#e2e8f0"><span class="cost-row-label">🍔 Meals ('+rtStops+' stop'+(rtStops!==1?'s':'')+' × $'+rtMealRate+'/pp × '+rd.travelers+(rd.travelers===1?' traveler':' travelers')+')</span><span class="cost-row-val">~$'+(stopsFood/mult).toFixed(2)+'</span></div>':'')+
        (hotelAmt>0?'<div class="cost-row" style="color:#e2e8f0"><span class="cost-row-label">🏨 Hotel ('+rtRmLabel+')</span><span class="cost-row-val">$'+hotelAmt.toFixed(2)+'</span></div>':'')+
      '</div>'+
      '<div class="cost-totals" style="margin-top:12px">'+
        '<div class="cost-total-item"><div class="cti-lbl" style="color:rgba(255,255,255,.55)">One way</div><div class="cti-val" style="color:#fff">$'+rtOW.toFixed(2)+'</div></div>'+
        (rd.roundTrip?'<div class="cost-total-item rt-total"><div class="cti-lbl" style="color:rgba(255,255,255,.55)">🔄 Round trip</div><div class="cti-val" style="color:#fff">$'+rtRT.toFixed(2)+'</div></div>':'')+
      '</div>'+
    '</div>';
  }

  // ── Local Trip Card ──
  if(dd&&dd.nights){
    html+='<div class="ov-dest-card">'+
      '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.6);margin-bottom:12px">📍 Local Trip</div>'+
      '<div style="font-size:20px;font-weight:900;color:#fff;margin-bottom:6px">'+dd.locShort+'</div>'+
      (dd.checkin&&dd.checkout?'<div style="font-size:12px;color:rgba(255,255,255,.65);margin-bottom:12px">'+dd.checkin+' → '+dd.checkout+'</div>':'')+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px">'+
        '<div style="background:rgba(255,255,255,.15);border-radius:10px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:900;color:#fff">'+dd.nights+'</div><div style="font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.4px;margin-top:2px">Nights</div></div>'+
        (ltHotel>0?'<div style="background:rgba(255,255,255,.15);border-radius:10px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:900;color:#fff">$'+ltHotel.toFixed(0)+'</div><div style="font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.4px;margin-top:2px">Hotel</div></div>':'')+
        (ltFood>0?'<div style="background:rgba(255,255,255,.15);border-radius:10px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:900;color:#fff">$'+ltFood.toFixed(0)+'</div><div style="font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.4px;margin-top:2px">Meals</div></div>':'')+
      '</div>'+
    '</div>';
  }

  // ── Quick Actions ──
  html+='<div class="ov-actions">'+
    (rd?'<button class="ov-action-btn ov-btn-rt" onclick="switchTab(\'rt\')">🚗 Road Trip</button>':'<div></div>')+
    '<button class="ov-action-btn ov-btn-exp" onclick="switchTab(\'exp\')">💰 Expenses</button>'+
    '<button class="ov-action-btn ov-btn-save" onclick="saveTripToHistory(this)">💾 Save Trip</button>'+
  '</div>';

  return html;
}

// ── FIREBASE TRIP SYNC ───────────────────────────────────────────────────────
var _tvRef=null, _tvSaving=false, _activeStateRef=null;
var _TV_CFG={apiKey:'AIzaSyB0hO4m0XPRqmrYegHtkV4KawJA2py1glU',authDomain:'gastos-casa-7f431.firebaseapp.com',databaseURL:'https://gastos-casa-7f431-default-rtdb.firebaseio.com'};
var _TV_SEC='lk62-gastos-9f3a7b2e';

function _tvTrips(){
  try{return JSON.parse(localStorage.getItem(_HIST_KEY)||'[]');}catch(e){return[];}
}
function _tvSave(trips){
  localStorage.setItem(_HIST_KEY,JSON.stringify(trips));
}
function syncTripsToFirebase(){
  if(!_tvRef)return;
  _tvSaving=true;
  var obj={};_tvTrips().forEach(function(t){obj[t.id]=t;});
  _tvRef.set(obj).then(function(){_tvSaving=false;}).catch(function(){_tvSaving=false;});
}

function syncActiveStateToFirebase(){
  if(!_activeStateRef) return;
  try{
    var state={rtView:_rtView,rtData:_rtData,
      activeTab:_activeTab,fields:_captureFields(),savedAt:new Date().toISOString()};
    _activeStateRef.set(state).catch(function(){});
  }catch(e){}
}
function _fbShowErr(msg){
  var el=document.getElementById('rt-history-list'),wrap=document.getElementById('rt-history-wrap');
  if(el&&wrap&&!_rtData){wrap.style.display='block';el.innerHTML='<div style="text-align:center;padding:12px;color:#dc2626;font-size:12px">'+msg+'</div>';}
}
function _fbDoSync(syncRestored){
  // Always push current active state to Firebase as soon as we have auth
  if(_rtData) syncActiveStateToFirebase();

  // ── ACTIVE STATE (fast path) — parallel with trips ───────────────────────
  _activeStateRef.once('value').then(function(stSnap){
    if(syncRestored[0]||_rtData) return;
    var fbS=stSnap.val();
    if(!fbS||!fbS.rtData) return;
    syncRestored[0]=true;
    try{_applyFields(fbS.fields);}catch(e){}
    _rtData=fbS.rtData; _rtView='results';
    try{document.getElementById('rt-results-content').innerHTML=buildRTHTML(_rtData);}catch(e){}
    saveState(); updateOverviewTab();
    switchTab((_rtData&&_rtView==='results')?'rt':(fbS.activeTab||'rt'));
    showToast('☁️ Viagem restaurada da nuvem',3500);
  }).catch(function(e){ console.warn('activeState:',e&&e.code); });

  // ── TRIPS HISTORY ────────────────────────────────────────────────────────
  _tvRef.once('value').then(function(snap){
    var fb=snap.val();
    if(fb&&typeof fb==='object'){
      var fbArr=Object.values(fb);
      var local=_tvTrips(), changed=false;
      fbArr.forEach(function(ft){
        if(ft&&ft.id&&!local.some(function(lt){return lt.id===ft.id;})){ local.push(ft); changed=true; }
      });
      if(changed){ local.sort(function(a,b){return (b.id||0)-(a.id||0);}); _tvSave(local); }
      renderHistorySection();
      if(!syncRestored[0]&&!_rtData&&fbArr.length){
        syncRestored[0]=true;
        var newest=fbArr.sort(function(a,b){return (b.id||0)-(a.id||0);})[0];
        if(newest&&newest.id){ loadHistoryEntry(newest.id); showToast('☁️ Viagem restaurada da nuvem',3500); }
      }
    } else {
      if(_tvTrips().length) syncTripsToFirebase();
      // Firebase returned empty — clear the loading spinner
      var _el=document.getElementById('rt-history-list');
      if(_el&&_el.innerHTML.includes('Buscando')){
        _el.innerHTML='<div style="text-align:center;padding:12px;color:var(--muted);font-size:12px">Nenhuma viagem salva ainda.</div>';
      }
      renderHistorySection();
    }
    // real-time listener for cross-device sync
    _tvRef.on('value',function(snap){
      if(_tvSaving)return;
      var fb=snap.val(); if(!fb||typeof fb!=='object')return;
      var fbArr=Object.values(fb), local=_tvTrips(), changed=false;
      fbArr.forEach(function(ft){
        if(ft&&ft.id&&!local.some(function(lt){return lt.id===ft.id;})){ local.push(ft); changed=true; }
      });
      var fbIds=fbArr.map(function(t){return t&&t.id;});
      var before=local.length;
      local=local.filter(function(lt){return fbIds.indexOf(lt.id)!==-1;});
      if(local.length!==before) changed=true;
      if(changed){ local.sort(function(a,b){return (b.id||0)-(a.id||0);}); _tvSave(local); renderHistorySection(); }
    });
  }).catch(function(e){
    _fbShowErr('⚠️ Firebase: '+(e&&e.code||'erro')+'.<br>Verifique conexão e tente o Update.');
  });
}
function initTripSync(){
  try{
    var app;
    try{app=firebase.app('tv');}catch(e){}
    if(!app)app=firebase.initializeApp(_TV_CFG,'tv');
    _tvRef=firebase.database(app).ref('gastos/'+_TV_SEC+'/trips');
    _activeStateRef=firebase.database(app).ref('gastos/'+_TV_SEC+'/activeState');

    // Show loading indicator whenever there is no active trip yet
    if(!_rtData){
      var _ldEl=document.getElementById('rt-history-list');
      var _ldWrap=document.getElementById('rt-history-wrap');
      if(_ldEl&&_ldWrap){_ldWrap.style.display='block';_ldEl.innerHTML='<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">☁️ Buscando viagens salvas...</div>';}
    }

    var _sr=[false]; // syncRestored flag (array so inner functions share reference)
    // Sign in anonymously if not already authenticated — required for Firebase DB access
    var auth=firebase.auth(app);
    if(auth.currentUser){
      _fbDoSync(_sr);
    } else {
      auth.signInAnonymously()
        .then(function(){ _fbDoSync(_sr); })
        .catch(function(e){
          console.warn('anon auth failed:',e&&e.code);
          _fbDoSync(_sr); // try anyway (rules might be open)
        });
    }
  }catch(e){ console.warn('initTripSync:',e); }
}

function forceUpdate(){
  saveState();
  var btn=document.getElementById('update-btn');
  if(btn){ btn.textContent='⏳ Atualizando…'; btn.disabled=true; }
  // Navega para reset.html — arquivo que o SW antigo não tem em cache,
  // então busca direto da rede. reset.html desregistra o SW e limpa caches
  // antes de navegar ao travel.html, garantindo carregamento 100% fresco.
  window.location.replace('./reset.html?_t='+Date.now());
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(function(){
  // Immediately restore Overview tab visibility from persisted flag — before any async
  try{
    if(JSON.parse(localStorage.getItem('trip_has_data')||'{}').has){
      var _ovBtn=document.getElementById('tab-ov');
      if(_ovBtn) _ovBtn.classList.remove('hidden');
    }
  }catch(e){}

  var restored=restoreState();
  // If RT results exist always open on Road Trip so user sees their route immediately
  var startTab=(_rtData&&_rtView==='results')?'rt':(restored?_activeTab:'rt');
  switchTab(startTab);
  updateOverviewTab();
  renderHistorySection();
  initTripSync();
  // Safety net: re-check Overview visibility after Firebase async init settles
  setTimeout(updateOverviewTab, 1500);
  // Proactive sync: push current state to Firebase 4s after load (Firebase auth needs time to init)
  if(_rtData) setTimeout(function(){ saveState(); syncActiveStateToFirebase(); }, 4000);
  window.addEventListener('pagehide',function(){ saveState(); syncActiveStateToFirebase(); });
  // visibilitychange fires more reliably than pagehide on iOS PWA
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'){ saveState(); syncActiveStateToFirebase(); }
  });

  // Version check — show banner when newer version is available
  var _myV='198';
  var _verEl=document.getElementById('tv-ver');
  if(_verEl) _verEl.textContent='v'+_myV;
  fetch('./version.json?_t='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.v && d.v>0 && String(d.v)!==_myV){
        var banner=document.getElementById('update-banner');
        var verLbl=document.getElementById('update-banner-ver');
        if(verLbl) verLbl.textContent='Você está na v'+_myV+' — disponível v'+d.v;
        if(banner) banner.style.display='block';
      }
    }).catch(function(){});

  // iOS bfcache fix: força recarga completa quando app é restaurado do bfcache
  window.addEventListener('pageshow',function(e){
    if(e.persisted){ window.location.reload(); }
  });

  // Register service worker for offline / PWA
  if('serviceWorker' in navigator){
    // Listener antes do register() para nunca perder o SW_UPDATED
    navigator.serviceWorker.addEventListener('message',function(e){
      if(e.data&&e.data.type==='SW_UPDATED'){
        var banner=document.getElementById('update-banner');
        if(banner) banner.style.display='block';
      }
    });
    // controllerchange = novo SW assumiu controle → mostra banner
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      var banner=document.getElementById('update-banner');
      if(banner) banner.style.display='block';
    });
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }

  // Show "Add to Home Screen" hint on iOS Safari (not standalone, not dismissed)
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = ('standalone' in navigator) && navigator.standalone;
  const dismissed = sessionStorage.getItem('iosHintDismissed');
  if(isIOS && !isStandalone && !dismissed){
    const hint = document.createElement('div');
    hint.id = 'ios-hint';
    hint.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#0c4a6e;color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;font-family:inherit;box-shadow:0 -4px 20px rgba(0,0,0,.3)';
    hint.innerHTML =
      '<span style="font-size:26px;flex-shrink:0">📲</span>'+
      '<div style="flex:1;font-size:13px;line-height:1.4"><strong>Install on iPhone</strong><br>Tap <strong>Share</strong> ⬆️ then <strong>"Add to Home Screen"</strong></div>'+
      '<button onclick="sessionStorage.setItem(\'iosHintDismissed\',\'1\');this.closest(\'#ios-hint\').remove()" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0">✕</button>';
    document.body.appendChild(hint);
  }
})();
</script>
